name: Release

# Pushing a tag vX.Y.Z on a commit of main publishes release X.Y.Z. Running
# the workflow by hand on main publishes a pre-release named after the latest
# release and the commit count, e.g. 0.2.0 (1234), tagged v0.2.0-1234. Either
# way it waits for that commit's CI run on main to pass (it is not run a second
# time), then publishes a GitHub Release with an ad-hoc signed IPA for
# re-signing installers (AltStore, Sideloadly). The build number is always the
# commit count.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same Xcode as ci.yml.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  checks:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # A manual run (workflow_dispatch) counts too, for a commit whose push did not run CI.
        run: |
          while :; do
            run="$(gh run list -R "${REPO}" --workflow ci.yml --commit "${SHA}" --limit 20 \
              --json status,conclusion,event,url \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0] // empty')"
            if [[ -z "${run}" ]]; then
              echo "::error::no CI run on main for ${SHA}; run the CI workflow on main, then push the tag again"
              exit 1
            fi
            status="$(jq -r .status <<<"${run}")"
            conclusion="$(jq -r .conclusion <<<"${run}")"
            url="$(jq -r .url <<<"${run}")"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] \
                || { echo "::error::CI for ${SHA} ended ${conclusion}: ${url}"; exit 1; }
              echo "CI passed: ${url}"
              exit 0
            fi
            echo "CI ${status}: ${url}"
            sleep 60
          done

  publish:
    name: Publish
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build number counts commits, and the main check needs its history.
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${REF} is not on main"; exit 1; }
          build="$(git rev-list --count HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${GITHUB_REF}" == refs/heads/main ]] \
              || { echo "::error::run the pre-release on main, not ${REF}"; exit 1; }
            release="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' HEAD)" \
              || { echo "::error::no vX.Y.Z release tag on main yet"; exit 1; }
            marketing="${release#v}"
            full="${marketing} (${build})" tag="v${marketing}-${build}" files="${marketing}-${build}" prerelease=true
          else
            [[ "${REF}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
              || { echo "::error::tag ${REF} is not vX.Y.Z"; exit 1; }
            marketing="${REF#v}"
            full="${marketing}" tag="${REF}" files="${marketing}" prerelease=false
          fi
          {
            echo "marketing=${marketing}"
            echo "full=${full}"
            echo "build=${build}"
            echo "tag=${tag}"
            echo "files=${files}"
            echo "prerelease=${prerelease}"
          } >>"${GITHUB_OUTPUT}"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build Release device app
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          APP_BUILD: ${{ steps.version.outputs.build }}
        run: Tools/CI/scripts/build-app.sh Release device
      - name: Check the Release device bundle
        run: Tools/CI/scripts/check-device-app.sh ".local/ci/app-builds/Release-device/DerivedData/Build/Products/Release-iphoneos/HostApp.app"
      # Signed for no team: the installer re-signs it under their own (package-ipa.sh).
      - name: Package IPA
        run: Tools/CI/scripts/package-ipa.sh "dist/Songyan-${{ steps.version.outputs.files }}.ipa"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.full }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        # A pre-release has no pushed tag: the release creates it on the commit that was built.
        run: |
          flags=(--generate-notes --title "松烟 ${VERSION}")
          if [[ "${PRERELEASE}" == true ]]; then
            flags+=(--prerelease --target "${GITHUB_SHA}")
          else
            flags+=(--verify-tag)
          fi
          gh release create "${TAG}" dist/*.ipa "${flags[@]}"
      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs
          path: .local/ci/app-Release-device/**/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
