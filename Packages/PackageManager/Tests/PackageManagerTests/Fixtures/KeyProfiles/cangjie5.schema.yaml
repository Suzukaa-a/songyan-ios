# Compiled form, trimmed to the sections a key profile reads.
schema:
  schema_id: cangjie5
  name: 倉頡五代
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - express_editor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;"
translator:
  dictionary: cangjie5
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"
reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "`[a-z]*'?$|[a-z]+'$"
