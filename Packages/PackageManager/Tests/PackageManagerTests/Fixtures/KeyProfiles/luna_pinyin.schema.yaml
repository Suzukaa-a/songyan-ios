# Compiled form, trimmed to the sections a key profile reads.
schema:
  schema_id: luna_pinyin
  name: 朙月拼音
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - express_editor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
translator:
  dictionary: luna_pinyin
reverse_lookup:
  dictionary: stroke
  prefix: "`"
  suffix: "'"
recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "`[a-z]*'?$"
