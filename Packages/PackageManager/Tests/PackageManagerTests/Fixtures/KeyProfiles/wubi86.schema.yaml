# Compiled form, trimmed to the sections a key profile reads.
schema:
  schema_id: wubi86
  name: 五笔86
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - express_editor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
speller:
  delimiter: " ;'"
translator:
  dictionary: wubi86
  enable_charset_filter: true
  enable_sentence: true
reverse_lookup:
  dictionary: pinyin_simp
  prefix: "z"
  suffix: "'"
  preedit_format:
    - xform/([nl])v/$1ü/
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "^z[a-z]*'?$"
