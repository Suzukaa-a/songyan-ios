# Minimal shared data for the post-commit prediction fixture.
# predict.db is built by Tools/BuildRimeIOS/scripts/gen-prediction-fixture.sh.
config_version: "0.1"

schema_list:
  - schema: prediction_probe

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
